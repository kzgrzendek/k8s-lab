apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lasuite-db
  namespace: {{.Namespace}}
spec:
  instances: 1

  # Use minimal PostgreSQL image for lab environment
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Primary update strategy (unsupervised for single-node)
  primaryUpdateStrategy: unsupervised

  # Storage configuration
  storage:
    size: 2Gi
    storageClass: local-path

  # Bootstrap configuration - initialize database with multiple databases
  bootstrap:
    initdb:
      database: opengatellm
      owner: lasuite
      secret:
        name: lasuite-db-secret
      # Create additional databases for LaSuite apps
      postInitApplicationSQL:
        - CREATE DATABASE conversations OWNER lasuite;

  # Resource limits (conservative for lab)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Monitoring disabled for minimal footprint
  monitoring:
    enablePodMonitor: false

# VictoriaLogs - Log aggregation and storage
# https://docs.victoriametrics.com/victorialogs/

server:
  # Disk-based retention
  retentionDiskSpaceUsage: 10GB

  # Storage size for ingested logs
  persistentVolume:
    size: 10Gi

  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: lasuite-redis
  namespace: {{.Namespace}}
spec:
  # Kubernetes configuration
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

  # Redis exporter disabled for minimal footprint
  redisExporter:
    enabled: false

  # Storage configuration
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 500Mi

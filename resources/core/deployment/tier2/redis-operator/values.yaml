# OT-CONTAINER-KIT Redis Operator values for Nova
# Chart: ot-helm/redis-operator
# Docs: https://ot-container-kit.github.io/redis-operator/

# Operator configuration
redisOperator:
  # Webhook enabled for CR validation (prod-like)
  webhook: true

# Number of replicas (single instance for lab env)
replicas: 1

# Resource limits (conservative for lab)
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Cert-manager subchart disabled - we use global cert-manager
# Certificate is created separately in certificates/webhook-cert.yaml
certmanager:
  enabled: false

# Don't create issuer - we use external Certificate resource
issuer:
  create: false

# Certificate secret name (must match our Certificate's secretName)
certificate:
  secretName: webhook-server-cert

# Security context for lab environment
podSecurityContext: {}

securityContext:
  runAsNonRoot: true

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-model
  namespace: llmd
  labels:
    app: llm-model-cache
    storage-type: hostpath
    model-slug: {{.ModelSlug}}
spec:
  accessModes:
    - ReadOnlyMany
  # No storageClassName - we use selector-based binding to specific PV
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  # Selector to bind to the model-specific hostPath PV
  selector:
    matchLabels:
      storage-tier: models
      model-slug: {{.ModelSlug}}

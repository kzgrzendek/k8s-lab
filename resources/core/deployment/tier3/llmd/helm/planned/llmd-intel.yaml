# =============================================================================
# PLANNED: Intel GPU Support (NOT YET IMPLEMENTED)
# =============================================================================
# This configuration file is preserved for future Intel GPU support.
# It is NOT currently used by Nova. When attempting to use Intel GPU mode,
# the system will fall back to CPU mode.
#
# To enable Intel GPU support in a future release:
# 1. Implement deployIntelDevicePlugin() in tier1/tier1.go
# 2. Move this file to the parent directory (helm/)
# 3. Update inference.go to route to this file for GPUModeIntel
# 4. Test with Intel Arc and integrated GPUs
#
# Hardware requirements:
# - Intel Arc discrete GPU (A770, A750, etc.) or
# - Intel integrated GPU with i915/xe driver
# - Intel oneAPI Base Toolkit installed on host
# =============================================================================

multinode: false

# Enable Intel GPU accelerator (i915 for integrated/older GPUs, xe for Arc)
accelerator:
  type: "intel-i915"

modelArtifacts:
  name: "{{.ModelName}}"
  # Use pre-warmed model from NFS-backed PVC if available
  # Format: pvc://pvc_name/path/to/model
  uri: "pvc://{{.ModelPVCName}}/"
  size: "8Gi"

  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "{{.ModelSlug}}"

routing:
  servicePort: 8000

  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1

    targetPort: 8200
    secure: false
    debugLevel: 1

decode:
  create: true
  replicas: 1

  nodeSelector:
    nova.local/node-type: gpu-intel

  containers:
    - name: vllm
      # IPEX-LLM: supports Intel iGPUs (UHD) + Arc discrete GPUs
      image: "{{.LLMDXpuImage}}"
      # Use IPEX-LLM vLLM entrypoint instead of standard vllmServe
      command:
        - python
        - -m
        - ipex_llm.vllm.xpu.entrypoints.openai.api_server
      args:
        - --model
        - /model-cache/
        - --served-model-name
        - "{{.ModelName}}"
        - --port
        - "8200"
        - --device
        - xpu
        - --load-in-low-bit
        - fp8
        - --max-model-len
        - "4096"
        - --gpu-memory-utilization
        - "0.8"

      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: token
              optional: true
        # IPEX-LLM Intel XPU environment variables
        - name: USE_XETLA
          value: "OFF"
        - name: SYCL_CACHE_PERSISTENT
          value: "1"
        - name: SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS
          value: "2"
        - name: FI_PROVIDER
          value: "shm"
        - name: CCL_WORKER_COUNT
          value: "1"

      ports:
        - containerPort: 8200
          protocol: TCP

      mountModelVolume: true

      resources:
        limits:
          cpu: "8"
          memory: "16Gi"
          # Intel GPU resource (i915 driver for integrated/older, xe for Arc)
          gpu.intel.com/i915: "1"
        requests:
          cpu: "4"
          memory: "8Gi"
          gpu.intel.com/i915: "1"

      startupProbe:
        httpGet:
          path: /v1/models
          port: 8200
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60

      livenessProbe:
        httpGet:
          path: /health
          port: 8200
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8200
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3

prefill:
  create: false

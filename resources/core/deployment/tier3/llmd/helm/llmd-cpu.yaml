multinode: false

# Disable GPU accelerator for CPU mode
# IMPORTANT: Must be "cpu", not "" - empty string defaults to "nvidia" in the chart
accelerator:
  type: "cpu"

modelArtifacts:
  name: "{{.ModelName}}"
  # Use pre-warmed model from NFS-backed PVC if available
  # Format: pvc://pvc_name/path/to/model
  uri: "pvc://{{.ModelPVCName}}/"
  size: "8Gi"

  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "{{.ModelSlug}}"

routing:
  servicePort: 8000

  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    imagePullPolicy: IfNotPresent

    targetPort: 8200
    secure: false
    debugLevel: 1

decode:
  create: true
  replicas: 1

  # Parallelism settings for CPU mode (tensor=0 means no GPU tensor parallelism)
  # Note: GPU resources are controlled by accelerator.type above, not tensor
  parallelism:
    tensor: 0
    data: 1
    dataLocal: 1
    workers: 1

  nodeSelector:
    nova.local/node-type: cpu

  containers:
    - name: vllm
      image: "{{.LLMDCpuImage}}"
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      args:
        - --max-model-len
        - "32768"

      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: token
              optional: true

      ports:
        - containerPort: 8200
          protocol: TCP

      mountModelVolume: true

      resources:
        limits:
          cpu: "8"
          memory: "24Gi"
        requests:
          cpu: "4"
          memory: "12Gi"

      startupProbe:
        httpGet:
          path: /v1/models
          port: 8200
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60

      livenessProbe:
        httpGet:
          path: /health
          port: 8200
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8200
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3

prefill:
  create: false

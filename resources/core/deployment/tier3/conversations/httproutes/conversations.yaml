apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: conversations-route
  namespace: conversations
spec:
  parentRefs:
  - name: nova-https
    namespace: envoy-gateway-system

  hostnames:
  - "conversations.{{.Domain}}"

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: conversations
      port: 80

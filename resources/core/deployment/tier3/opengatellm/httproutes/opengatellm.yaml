apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opengatellm-route
  namespace: opengatellm
spec:
  parentRefs:
  - name: nova-https
    namespace: envoy-gateway-system

  hostnames:
  - "opengatellm.{{.Domain}}"

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: opengatellm
      port: 80

# Intel Device Plugins Operator Configuration
# Documentation: https://intel.github.io/intel-device-plugins-for-kubernetes/

# Deploy only on the elected GPU node (labeled in tier0)
# This mirrors NVIDIA GPU Operator behavior
nodeSelector:
  nova.local/node-type: gpu-intel

# Tolerate any node taints (including control-plane for single-node clusters)
tolerations:
  - operator: Exists

# Increase probe timeouts to prevent false failures during startup
manager:
  # Increase resources - defaults (100m CPU, 120Mi) cause OOMKill during webhook registration
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 5

  readinessProbe:
    initialDelaySeconds: 20
    timeoutSeconds: 10
    periodSeconds: 15
    failureThreshold: 5
